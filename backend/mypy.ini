; mypy configuration for the iAdopt backend.
;
; Phase 1 scope: strict checking on the newly typed boundaries — the schemas
; package and the core config leaf. The legacy app.main monolith is checked
; loosely for now; Phase 2/3 will tighten it as code moves into typed modules.
;
; Run from backend/:  python -m mypy --config-file mypy.ini app/schemas app/core

[mypy]
python_version = 3.12
plugins = pydantic.mypy
mypy_path = .
explicit_package_bases = True
namespace_packages = True
; Default posture for the codebase: lenient, so importing the legacy monolith
; doesn't drown the typed-boundary signal.
ignore_missing_imports = True
warn_unused_configs = True

; ----------------------------------------------------------------------------
; Strict on the typed boundaries introduced in Phase 1.
; ----------------------------------------------------------------------------
[mypy-app.schemas.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-app.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-app.clients.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
no_implicit_optional = True
strict_equality = True

; The Pydantic mypy plugin: validate model construction strictly.
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
