name: Publish Portainer production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portainer-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/prod' }}
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        component:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=portainer-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=portainer-${{ matrix.component }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/iadopt-${{ matrix.component }}:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/iadopt-${{ matrix.component }}:prod

  redeploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: portainer-production
    steps:
      - name: Trigger Portainer GitOps webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL is not configured; images were published without redeployment."
            exit 0
          fi
          echo "::add-mask::$PORTAINER_WEBHOOK_URL"
          curl --fail --silent --show-error --request POST "$PORTAINER_WEBHOOK_URL"
