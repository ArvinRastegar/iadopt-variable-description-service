<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - I-ADOPT Variable Description Service</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14171c;
      --panel: #20252d;
      --border: #3b4350;
      --text: #f4f7fb;
      --muted: #aeb8c5;
      --accent: #5fa8ff;
      --danger: #ff7a7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 28px;
      text-align: left;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #11151a;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #06101d;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #status {
      min-height: 1.4em;
      margin-top: 14px;
      color: var(--danger);
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>I-ADOPT Login</h1>
    <p>Sign in to use the variable description service.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <button id="loginButton" type="submit">Sign in</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || '/';
    const form = document.querySelector('#loginForm');
    const button = document.querySelector('#loginButton');
    const statusEl = document.querySelector('#status');

    async function redirectIfAlreadySignedIn() {
      try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
          window.location.replace(redirect);
        }
      } catch (error) {
        console.error(error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = '';
      button.disabled = true;
      button.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.querySelector('#username').value.trim(),
            password: document.querySelector('#password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail || 'Login failed.');
        }

        window.location.replace(redirect);
      } catch (error) {
        statusEl.textContent = error.message || 'Login failed.';
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });

    redirectIfAlreadySignedIn();
  </script>
</body>

</html>
