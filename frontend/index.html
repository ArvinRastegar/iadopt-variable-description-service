<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Describe a variable in plain words and get it back as an I-ADOPT decomposition you can review, export or publish." />
  <title>I-ADOPT Variable Description Service</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <script>
    // Apply the remembered or system theme before the first paint.
    try {
      var stored = localStorage.getItem('iadopt-theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <!-- Text measurement element used by the diagram layout engine (src/lib/createLayout/getTextDims.js). -->
  <div id="helper" aria-hidden="true">
    <svg><text></text></svg>
  </div>
  <noscript>This service needs JavaScript to decompose, draw and edit variables.</noscript>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
