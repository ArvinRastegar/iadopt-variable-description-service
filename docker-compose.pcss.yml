services:
  backend:
    image: ${PCSS_REGISTRY}/${PCSS_IMAGE_NAMESPACE}/iadopt-backend:${IMAGE_TAG:-prod}
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readyz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${PCSS_REGISTRY}/${PCSS_IMAGE_NAMESPACE}/iadopt-frontend:${IMAGE_TAG:-prod}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
