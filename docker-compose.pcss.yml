services:
  backend:
    image: ${PCSS_REGISTRY}/${PCSS_IMAGE_NAMESPACE}/iadopt-backend:${IMAGE_TAG:-prod}
    env_file:
      - .env
    environment:
      IADOPT_AUTH_ENABLED: ${IADOPT_AUTH_ENABLED:-true}
      IADOPT_SESSION_SECRET: ${IADOPT_SESSION_SECRET}
      IADOPT_BOOTSTRAP_ADMIN_USERNAME: ${IADOPT_BOOTSTRAP_ADMIN_USERNAME}
      IADOPT_BOOTSTRAP_ADMIN_PASSWORD: ${IADOPT_BOOTSTRAP_ADMIN_PASSWORD}
      IADOPT_COOKIE_SECURE: ${IADOPT_COOKIE_SECURE:-true}
      IADOPT_AUDIT_RETENTION_DAYS: ${IADOPT_AUDIT_RETENTION_DAYS:-30}
      IADOPT_AUDIT_MAX_PAYLOAD_BYTES: ${IADOPT_AUDIT_MAX_PAYLOAD_BYTES:-1000000}
    expose:
      - "8000"
    volumes:
      - backend_state:/app/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readyz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  frontend:
    image: ${PCSS_REGISTRY}/${PCSS_IMAGE_NAMESPACE}/iadopt-frontend:${IMAGE_TAG:-prod}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_state:
